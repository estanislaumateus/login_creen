<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Document</title>
</head>

<body>
    <div class="card">
        <div class="hero">
            <div class="hero-inner">
                <h2>The easiest way to send...</h2>
                <h3>End to end encrypted transfers</h3>
            </div>
        </div>
        <form >
            <img src="./img/New-logo-PRIMARY.png" alt="logo-guilnes">
            <h3>Login to your account</h3>
            <div class="socials">
                <button class="social-btn" >
                    <img src="./img/google.jpg" alt="google">
                    <p><span class="extra-text">login with</span>Google</p>
                </button>

                <button class="social-btn" >
                    <img src="./img/facebook.jpg" alt="facebook">        
                    <p><span class="extra-text">login with</span>Facebook</p>
                </button>
            </div>
            <span class="or"></span>
            <input type="text" placeholder="Email">
            <input type="password" placeholder="Password">
            <button type="submit">Login</button>
        </form>
    </div>
</body>

</html>
